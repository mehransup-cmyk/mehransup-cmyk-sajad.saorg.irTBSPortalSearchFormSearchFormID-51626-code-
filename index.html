<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سامانه استعلام — نمونه نمایشی</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: Tahoma, Arial, sans-serif;
    background: #f1f1f1;
    color: #333;
    font-size: 14px;
  }

  .topbar {
    height: 94px;
    background: linear-gradient(110deg, #b9ddea 0%, #5bb9d8 58%, #159ac9 100%);
    border-bottom: 1px solid #8dbbc9;
    position: relative;
  }

  .brand {
    position: absolute;
    right: 24px;
    top: 0;
    height: 94px;
    display: flex;
    align-items: center;
  }

  .header-logo {
    display: block;
    width: auto;
    height: 94px;
    max-width: 360px;
    object-fit: contain;
  }

  .page {
    min-height: calc(100vh - 132px);
    padding: 10px 4px 58px;
  }

  .panel {
    position: relative;
    background: #f7f7f7;
    border: 1px solid #1592ed;
    border-radius: 5px;
    min-height: 470px;
    padding: 48px 24px 24px;
    box-shadow: 0 0 0 1px rgba(255,255,255,.6) inset;
  }

  .panel-title {
    position: absolute;
    top: -13px;
    right: 6px;
    background: #2196e6;
    color: #fff;
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 13px;
  }

  .field-label {
    display: block;
    text-align: right;
    margin: 0 0 4px;
  }

  .code-input {
    display: block;
    width: 66%;
    margin: 0 0 27px auto;
    height: 30px;
    border: 1px solid #cfcfcf;
    border-radius: 4px;
    background: #fff;
    padding: 3px 8px;
    outline: none;
  }

  .instruction {
    text-align: right;
    margin: 0 0 25px;
  }

  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: flex-start;
    column-gap: 7%;
    row-gap: 20px;
    margin-top: 4px;
    padding: 0 2%;
  }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 7px;
    line-height: 1.7;
    width: 100%;
    cursor: pointer;
  }

  .main-option {
    width: 100%;
  }

  .options > .main-option:nth-child(1) {
    grid-column: 2;
    grid-row: 1;
  }

  .options > .main-option:nth-child(2) {
    grid-column: 1;
    grid-row: 1;
  }

  .option input { margin-top: 4px; }

  .academic-options {
    display: none;
    width: 100%;
    margin: 2px 0 2px;
    padding: 0;
    gap: 18px;
  }

  .academic-options.visible { display: contents; }

  .academic-options .option {
    width: 100%;
    justify-content: flex-start;
  }

  .institution-fields {
    display: none;
    width: 100%;
    gap: 12px;
    padding: 0;
  }

  .institution-fields.visible { display: contents; }

  .academic-options > .option:nth-child(1) {
    grid-column: 2;
    grid-row: 2;
  }

  .academic-options > .option:nth-child(2) {
    grid-column: 1;
    grid-row: 2;
  }

  .select-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
    width: 100%;
  }

  .select-group:nth-child(1) {
    grid-column: 2;
    grid-row: 3;
  }

  .select-group:nth-child(2) {
    grid-column: 1;
    grid-row: 3;
  }

  .institution-fields select {
    flex: 1;
    height: 31px;
    padding: 3px 8px;
    border: 1px solid #cfcfcf;
    border-radius: 4px;
    background: #fff;
    color: #555;
    font-family: Tahoma, Arial, sans-serif;
  }

  .captcha-area {
    position: absolute;
    right: 14px;
    bottom: 27px;
    display: flex;
    align-items: stretch;
    direction: ltr;
  }

  .captcha-text {
    width: 100px;
    height: 39px;
    border: 1px solid #c9c9c9;
    background: #080b82;
    color: #fff;
    display: grid;
    place-items: center;
    font-family: Georgia, serif;
    font-size: 19px;
    letter-spacing: 1px;
    user-select: none;
    text-shadow: 1px 1px 1px #000;
  }

  .captcha-input {
    width: 100px;
    height: 39px;
    border: 1px solid #c9c9c9;
    padding: 5px;
    font-family: Tahoma, Arial;
    direction: rtl;
  }

  .refresh {
    width: 39px;
    height: 39px;
    border: 1px solid #c9c9c9;
    background: #eee;
    color: #555;
    cursor: pointer;
    font-size: 20px;
  }

  .submit {
    height: 39px;
    padding: 0 15px;
    border: 1px solid #ccc;
    background: #fff;
    color: #555;
    cursor: pointer;
    font-family: Tahoma, Arial;
  }

  .submit:hover, .refresh:hover { background: #f5f5f5; }

  .demo-note {
    position: absolute;
    left: 18px;
    bottom: 18px;
    color: #888;
    font-size: 11px;
  }

  .site-footer {
    position: fixed;
    right: 0;
    bottom: 0;
    left: 0;
    height: 35px;
    padding: 9px 28px;
    background: #1267cb;
    color: #fff;
    font-size: 11px;
    text-align: right;
  }

  @media (max-width: 700px) {
    .brand { right: 12px; }
    .header-logo { max-width: 280px; height: 78px; }
    .code-input { width: 100%; }
    .options { display: flex; flex-direction: column; gap: 14px; }
    .main-option, .academic-options { width: 100%; }
    .academic-options { padding-left: 0; }
    .captcha-area { position: static; margin-top: 95px; flex-wrap: wrap; }
    .panel { padding-left: 12px; padding-right: 12px; }
  }

.result-table{width:100%;max-width:760px;margin:25px auto;border-collapse:collapse;background:#fff}.result-table th,.result-table td{border:1px solid #d5d5d5;padding:12px 14px;text-align:right}.result-table th{width:35%;background:#eaf5fb}.back-button{display:block;margin:22px auto 0;padding:9px 22px;border:1px solid #ccc;border-radius:4px;background:#fff;color:#555;cursor:pointer;font-family:Tahoma,Arial}
</style>

<style>
.custom-searchable-select {
  position: relative;
  width: 235px;
  max-width: 100%;
  direction: rtl;
}
.custom-select-display {
  width: 100%;
  height: 38px;
  min-height: 38px;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 8px;
  background: #fff;
  padding: 6px 12px 6px 34px;
  font-family: inherit;
  font-size: inherit;
  text-align: right;
  cursor: pointer;
  position: relative;
}
.custom-select-display:hover {
  background: #f39c12;
  border-color: #e67e22;
  color: #fff;
}

.custom-select-display::before {
  content: "▼";
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 11px;
}
.custom-select-menu {
  display: none;
  position: absolute;
  z-index: 1000;
  top: calc(100% + 2px);
  right: 0;
  left: auto;
  width: 285px;
  max-width: 100%;
  background: #fff;
  border: 1px solid #b9c7d8;
  border-radius: 8px;
  box-shadow: 0 5px 16px rgba(0,0,0,.15);
  overflow: hidden;
}
.custom-select-menu.open {
  display: block;
}
.custom-select-search {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px;
  background: #fff;
  border-bottom: 1px solid #ddd;
}
.custom-select-search input {
  flex: 1;
  min-width: 0;
  height: 32px;
  box-sizing: border-box;
  border: 1px solid #b9c7d8;
  border-radius: 6px;
  padding: 6px 10px;
  direction: rtl;
  text-align: right;
  font-family: inherit;
  outline: none;
}
.custom-select-search span {
  font-size: 24px;
  width: 30px;
  text-align: center;
}
.custom-select-options {
  max-height: 210px;
  overflow-y: auto;
  background: #fff;
}
.custom-select-option {
  padding: 8px 12px;
  cursor: pointer;
  text-align: right;
  direction: rtl;
}
.custom-select-option:hover {
  background: #f39c12;
  color: #fff;
}

.custom-select-option.selected {
  background: #eaf3ff;
  color: #333;
}

/* فضای خالی/گزینه بدون عنوان آبی بماند و فقط عنوان‌ها با Hover نارنجی شوند */
.custom-select-option:empty {
  background: #1267cb;
  color: #333;
}
.custom-select-option:empty:hover {
  background: #1267cb;
  color: #333;
}
.custom-select-display.open {
  background: #f39c12;
  color: #fff;
  border-color: #e67e22;
}
</style>


<style>
.custom-select-display.disabled-by-type {
  opacity: .6;
  cursor: not-allowed;
}
</style>

</head>

<script>
function makeDropdownSearchable(selectId) {
  const select = document.getElementById(selectId);
  if (!select || select.dataset.searchable === "true") return;
  select.dataset.searchable = "true";

  const options = Array.from(select.options).map(o => ({
    value: o.value,
    text: o.textContent
  }));

  const wrapper = document.createElement("div");
  wrapper.className = "custom-searchable-select";
  select.parentNode.insertBefore(wrapper, select);
  select.style.display = "none";

  const display = document.createElement("button");
  display.type = "button";
  display.className = "custom-select-display";
  display.textContent = select.options[select.selectedIndex]?.textContent || "";
  wrapper.appendChild(display);

  const menu = document.createElement("div");
  menu.className = "custom-select-menu";
  menu.innerHTML = `
    <div class="custom-select-search">
      <input type="search" placeholder="جستجو..." autocomplete="off">
      <span>⌕</span>
    </div>
    <div class="custom-select-options"></div>
  `;
  wrapper.appendChild(menu);

  const search = menu.querySelector("input");
  const optionsBox = menu.querySelector(".custom-select-options");

  function render(filter="") {
    const q = filter.trim().toLocaleLowerCase("fa");
    optionsBox.innerHTML = "";
    options
      .filter(o => !q || o.text.toLocaleLowerCase("fa").includes(q))
      .forEach(o => {
        const item = document.createElement("div");
        item.className = "custom-select-option";
        item.textContent = o.text;
        if (o.value === select.value) item.classList.add("selected");
        item.addEventListener("click", () => {
          select.value = o.value;
          select.dispatchEvent(new Event("change", {bubbles:true}));
          display.textContent = o.text;
          menu.classList.remove("open");
          search.value = "";
          render("");
        });
        optionsBox.appendChild(item);
      });
  }

  display.addEventListener("click", () => {
    if (selectId === "institutionName") {
      const typeSelect = document.getElementById("institutionType");
      if (!typeSelect || !typeSelect.value) return;
    }
    menu.classList.toggle("open");
    display.classList.toggle("open", menu.classList.contains("open"));
    if (menu.classList.contains("open")) {
      render(search.value);
      search.focus();
    }
  });

  search.addEventListener("input", () => render(search.value));

  document.addEventListener("click", (e) => {
    if (!wrapper.contains(e.target)) {
      menu.classList.remove("open");
      display.classList.remove("open");
    }
  });

  render();
}

document.addEventListener("DOMContentLoaded", () => {
  makeDropdownSearchable("institutionType");
  makeDropdownSearchable("institutionName");

  const typeSelect = document.getElementById("institutionType");
  const nameSelect = document.getElementById("institutionName");
  const nameButton = nameSelect?.parentElement?.querySelector(".custom-select-display");

  function updateNameState() {
    const enabled = !!typeSelect?.value;
    if (nameButton) {
      nameButton.classList.toggle("disabled-by-type", !enabled);
      nameButton.disabled = !enabled;
    }
  }

  typeSelect?.addEventListener("change", updateNameState);
  updateNameState();
});</script>
